<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秘密のページ</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #121212;
      color: #fff;
    }
    button {
      padding: 20px 40px;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      background-color: #ff4757;
      color: white;
      font-weight: bold;
    }
    button:active {
      transform: scale(0.95);
    }
    .count {
      font-size: 3rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="count" id="counter">0 / 100</div>
  <button id="tapBtn">タップして解読を進める</button>

  <script>
    let count = 0;
    const target = 100;
    const counterEl = document.getElementById('counter');
    const btnEl = document.getElementById('tapBtn');

    btnEl.addEventListener('click', () => {
      count++;
      counterEl.textContent = `${count} / ${target}`;

      // 90回を超えたら煽る
      if (count === 90) {
        btnEl.textContent = "are you seriously going to do it?";
      }

      // 100回に達したらリックロールへ飛ばす
      if (count >= target) {
        window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
      }
    });
  </script>
</body>
</html>
